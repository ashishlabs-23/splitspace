services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/splitspace.db
      JWT_SECRET: change-this-secret
      FRONTEND_URL: http://localhost:3000
    volumes:
      - splitspace_data:/data
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  splitspace_data:
