name: SplitSpace CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: 🧪 Pure Ledger Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Native Mathematical Engine Tests
        run: node scripts/test-engine.mjs

  frontend-verify:
    name: ⚡ TypeScript & Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (Strict TypeScript Verification)
        run: npx tsc --noEmit

      - name: Build Next.js Static Export
        run: npm run build

  rules-verify:
    name: 🛡️ Firestore Security Rules Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Firestore Rules Syntax & Integrity
        run: node scripts/verify-rules.js
